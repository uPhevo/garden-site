server {
    listen 80;
    server_name uphevo-garden-site-e87c.twc1.net;

    client_max_body_size 20M;

    location /static/ {
        alias /Users/elklemente777gmail.com/Documents/SkazocniySad/project_root/staticfiles/;
    }

    location /media/ {
        alias /Users/elklemente777gmail.com/Documents/SkazocniySad/project_root/media/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://127.0.0.1:8000;   # Обрати внимание — без слэша на конце
    }
}
